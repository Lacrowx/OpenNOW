# tvOS sideload build of the iOS client. Shares ../OpenNOWiOS/OpenNOWiOS sources.
# Regenerate the Xcode project with: xcodegen generate --spec ios/OpenNOWtvOS/project.yml
name: OpenNOWtvOS
options:
  bundleIdPrefix: opennow.sideload
  deploymentTarget:
    tvOS: "27.1"
  createIntermediateGroups: true
# Team and bundle id come from Signing.xcconfig and your own Signing.local.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.191"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    # Project-wide: the test bundle rebuilds the OpenSSL module when it imports the app.
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - $(BUILT_PRODUCTS_DIR)/OpenSSL.framework/Headers
      - $(BUILT_PRODUCTS_DIR)/XCFrameworkIntermediates/OpenSSL/OpenSSL.framework/Headers
    OTHER_CFLAGS:
      - $(inherited)
      - -Wno-incomplete-umbrella
targets:
  OpenNOWtvOS:
    type: application
    platform: tvOS
    scheme:
      testTargets:
        - OpenNOWtvOSTests
    sources:
      - path: ../OpenNOWiOS/OpenNOWiOS
        excludes:
          - Info.plist
          - AppIcon.icon
          - NVST/README.md
          - NVST/LICENSE
          - NVST/UPSTREAM.json
          - NativeStreamPresentation.swift
      - path: Sources
      - path: Shared
      - path: Resources
      - path: TVAssets.xcassets
    dependencies:
      - framework: Frameworks/OpenSSL.xcframework
        embed: false
      - framework: Frameworks/usrsctp.xcframework
        embed: false
      - target: OpenNOWtvOSTopShelf
    # The Top Shelf extension reads what the app writes through this group.
    entitlements:
      path: OpenNOWtvOS.entitlements
      properties:
        com.apple.security.application-groups: [group.$(OPENNOW_TVOS_BUNDLE_ID)]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: OpenNOW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.opencloudgaming.opennow.auth
            CFBundleURLSchemes: [opennowios, opennow]
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        ITSAppUsesNonExemptEncryption: false
        # Console shell fonts, the same files the Qt client ships (SIL Open Font License 1.1).
        UIAppFonts:
          - Nunito-Variable.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-Bold.ttf
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        OpenNOWAppGroup: group.$(OPENNOW_TVOS_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENNOW_TVOS_BUNDLE_ID)
        PRODUCT_NAME: OpenNOW
        # The shared NVST tests import the app as `OpenNOWiOS`.
        PRODUCT_MODULE_NAME: OpenNOWiOS
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        SWIFT_EMIT_LOC_STRINGS: YES
  # The Top Shelf above the app on the Apple TV Home screen: the running game and the recently
  # played ones, from the snapshot the app saves in the shared app group.
  OpenNOWtvOSTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: Shared
    entitlements:
      path: TopShelf/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.$(OPENNOW_TVOS_BUNDLE_ID)]
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: OpenNOW Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OpenNOWAppGroup: group.$(OPENNOW_TVOS_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TopShelfContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENNOW_TVOS_BUNDLE_ID).topshelf
        PRODUCT_NAME: OpenNOWTopShelf
        TARGETED_DEVICE_FAMILY: "3"
        APPLICATION_EXTENSION_API_ONLY: YES
  # The iOS project's NVST protocol tests, run against the tvOS build of the same sources, plus
  # the tests for the tvOS-only sources.
  OpenNOWtvOSTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: ../OpenNOWiOS/OpenNOWiOSTests/NVST
      - path: Tests
    dependencies:
      - target: OpenNOWtvOS
      - framework: Frameworks/usrsctp.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENNOW_TVOS_BUNDLE_ID).tests
        # The app's product is named OpenNOW, not after its target.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenNOW.app/OpenNOW
        BUNDLE_LOADER: $(TEST_HOST)
