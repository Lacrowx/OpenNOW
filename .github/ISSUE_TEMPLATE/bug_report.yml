name: Bug Report (Apple TV)
description: Report a bug in OpenNOW for Apple TV
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is the Apple TV (tvOS) port only. For the desktop, iPhone, iPad or Android apps, report at [OpenCloudGaming/OpenNOW](https://github.com/OpenCloudGaming/OpenNOW/issues).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and how to make it happen again
      placeholder: |
        What went wrong?

        Steps to reproduce (if applicable):
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenNOW version
      description: The release you installed, or the date you last ran the installer or `git pull`
      placeholder: "1.1.191"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Apple TV model and tvOS version
      placeholder: "Apple TV 4K (3rd generation), tvOS 27.1"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - install.sh installer
        - By hand with Xcode
        - Unsigned IPA with a sideloading tool
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: Controller
      placeholder: "DualSense, Xbox Wireless Controller, Siri Remote only, ..."

  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Ethernet
        - Wi-Fi

  - type: dropdown
    id: tier
    attributes:
      label: GeForce NOW Tier
      options:
        - Free
        - Performance
        - Ultimate
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Logs or screenshots (optional)
      description: |
        Photos of the TV, the end-of-session report, or the build log (`Build/tvos-device-build.log`) if the install failed.
      render: shell
